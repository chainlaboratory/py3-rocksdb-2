[metadata]
# PyPI distribution name. The plain `rocksdb` name is taken upstream, and this
# line continues the existing py3-rocksdb release. The import package is still
# `rocksdb` (see [options] below): `import rocksdb` stays unchanged.
name = py3-rocksdb
version = 2.4.0
description = Python bindings for RocksDB
long_description = file: README.rst
long_description_content_type = text/x-rst
author = Daniel Siegmann
author_email = dsiegmann@bluewin.ch
url = https://github.com/chainlaboratory/python-rocksdb
project_urls =
    Bug Reports = https://github.com/chainlaboratory/python-rocksdb/issues
    Repository = https://github.com/chainlaboratory/python-rocksdb
    Upstream = https://github.com/f321x/python-rocksdb
license = BSD 3-Clause License
license_files = LICENSE
keywords = rocksdb bindings
classifiers =
    Development Status :: 4 - Beta
    Intended Audience :: Developers
    License :: OSI Approved :: BSD License
    Programming Language :: Python :: 3
    Programming Language :: Python :: 3.11
    Programming Language :: Python :: 3.12
    Programming Language :: Python :: 3.13
    Programming Language :: Python :: 3.14
    Topic :: Database

[options]
packages = find:
package_dir =
    rocksdb = rocksdb
include_package_data = True
zip_safe = False
python_requires = >=3.11

[options.packages.find]
where = .

[options.extras_require]
doc =
    sphinx>=7.2,<10
test =
    pytest>=8
